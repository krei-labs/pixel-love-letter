<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy 2 Months ♡</title>
  <meta name="description" content="A cute interactive pixel-art love letter celebrating two months of being together." />
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>document.documentElement.classList.add('js')</script>
  <link rel="stylesheet" href="./love.css" />
</head>
<body>
  <!-- Background Music Element -->
  <!-- Change the src to any romantic MP3 link or local audio file you prefer -->
 <audio id="bgMusic" src="background-music.mp3" preload="auto" loop></audio>

  <div class="fx" aria-hidden="true">
    <div class="fx__aurora"></div>
    <div class="fx__vignette"></div>
    <div class="fx__grain"></div>
  </div>

  <div class="rain" id="rain" aria-hidden="true"></div>

  <main class="scene">
    <div class="confetti" id="confetti" aria-hidden="true"></div>

    <div class="stage stage--aim" id="aimStage" tabindex="0" role="application"
         aria-label="Aim and shoot Cupid's arrow at the letter to open it. Press space to shoot.">

      <div class="target" id="target">
        <div class="envelope" aria-hidden="true">
          <span class="envelope__flap"></span>
          <span class="heart envelope__seal"></span>
        </div>
        <p class="target__label">
          <span class="heart heart--inline"></span>
          Happy 2 Months
          <span class="heart heart--inline"></span>
        </p>
      </div>

      <div class="arrow" id="arrow" aria-hidden="true"></div>

      <div class="archer" id="archer" aria-hidden="true">
        <div class="bow" id="bow"></div>
        <span class="nock" id="nock"></span>
      </div>

      <p class="hint" id="hint">
        <span id="hintText">Aim &amp; release to shoot Cupid&rsquo;s arrow</span>
        <span class="heart heart--inline"></span>
      </p>
    </div>

    <section class="window" id="window" aria-hidden="true">
      <header class="titlebar">
        <span class="titlebar__name">FROM YOU.EXE</span>
        <span class="titlebar__btns">
          <!-- Cute Interactive Music Toggle Button -->
          <button class="winbtn" type="button" id="musicBtn" aria-label="Toggle Music" title="Play Music">🎵</button>
          <button class="winbtn" type="button" aria-label="Minimize" tabindex="-1">&#95;</button>
          <button class="winbtn" type="button" aria-label="Maximize" tabindex="-1">&#9633;</button>
          <button class="winbtn winbtn--x" type="button" id="closeBtn" aria-label="Close letter">&#10005;</button>
        </span>
      </header>

      <div class="heartrow" aria-hidden="true">
        <span class="heart"></span><span class="hdot"></span>
        <span class="heart"></span><span class="hdot"></span>
        <span class="heart"></span>
      </div>

      <div class="content" id="content">
        <h1 class="title" id="title">
  Happy 2 months, my love ♡
  <span class="title-sub">Still love me?</span>
</h1>
        
        <canvas class="cat" id="cat" width="16" height="16" aria-label="A little cat holding a heart" role="img"></canvas>
        
        <!-- Surprise Photo Gallery Frame (Hidden initially) -->
        <div class="gallery" id="gallery" hidden>
          <div class="photo-frame">
            <!-- Replace these URLs with real paths to your photos (e.g., ./images/us1.jpg) -->
            <img src="photo1.jpg" class="gallery__img active" alt="Memory 1">
            <img src="photo2.jpg" class="gallery__img" alt="Memory 2">
            <img src="photo3.jpg" class="gallery__img" alt="Memory 3">
            <img src="photo4.jpg" class="gallery__img" alt="Memory 4">
            <img src="photo5.jpg" class="gallery__img" alt="Memory 5">
            <img src="photo6.jpg" class="gallery__img" alt="Memory 6">
          </div>
          <p class="gallery__caption">Click photos to flip through ♡</p>
        </div>

        <div class="buttons" id="buttons">
          <button class="btn btn--yes" type="button" id="yesBtn">YES</button>
          <button class="btn btn--no"  type="button" id="noBtn">NO</button>
        </div>
        
        <p class="final" id="final" hidden>
          Two months down, a <mark>lifetime</mark> to go.
          Happy Monthsary, my love ♡
          <span class="heart heart--inline"></span>
        </p>
      </div>
    </section>
  </main>

  <script type="module" src="./love.js"></script>
</body>
</html>
